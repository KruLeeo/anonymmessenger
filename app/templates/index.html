<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анонимные сообщения</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        textarea { width: 100%; height: 150px; margin: 10px 0; }
        select, button { padding: 8px; margin: 10px 0; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>Анонимное сообщение для кафедры</h1>
    
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    
    <form method="POST">
        <label for="department">Выберите кафедру:</label>
        <select id="department" name="department" required>
            <option value="">-- Выберите кафедру --</option>
            {% for department in departments %}
                <option value="{{ department }}">{{ department }}</option>
            {% endfor %}
        </select>
        
        <label for="message">Текст письма:</label>
        <textarea id="message" name="message" placeholder="Введите ваше сообщение..." required></textarea>
        
        <button type="submit">Отправить анонимно</button>
    </form>
</body>
</html>
